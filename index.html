<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for edge-to-edge display + safe-area insets on Android -->
    <!-- interactive-widget=resizes-content makes Chrome resize the layout (instead of
         overlaying) when the keyboard opens, so the chat input is never covered -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Roleplay Playground</title>
    <meta name="description" content="Roleplay Playground - immersive AI roleplay with tree-based branching and Supabase cloud sync across web and Android." />
    <meta property="og:title" content="Roleplay Playground" />
    <meta property="og:description" content="Immersive AI roleplay with tree-based branching and Supabase cloud sync across web and Android." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-violet-500/30 selection:text-violet-200">
    <script>
      // Immediately check if this window was opened as an OAuth redirect callback
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          if (hash.indexOf('access_token=') !== -1 || search.indexOf('access_token=') !== -1) {
            if (window.opener && window.opener !== window) {
              window.opener.postMessage({
                type: 'SUPABASE_AUTH_CALLBACK',
                hash: hash,
                search: search,
                fullUrl: window.location.href
              }, '*');
              setTimeout(function() {
                window.close();
              }, 400);
            }
          }
        } catch (e) {
          console.warn('Callback script error:', e);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
