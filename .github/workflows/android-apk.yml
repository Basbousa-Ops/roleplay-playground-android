name: Build Android APK

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # NOTE: no android-actions/setup-android step — ubuntu-latest runners
      # already include the full Android SDK. setup-android@v3 crashes trying
      # to install the legacy 'tools' package Google removed from the repos.

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Bake the same Supabase backend as the web app so sync works.
          # Override in GitHub repo Settings -> Secrets and variables -> Actions if needed.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add + sync Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/cap-after-sync.cjs

      - name: Generate icons/splash
        run: npm run assets:generate || npx @capacitor/assets generate --android --iconBackgroundColor '#09090b' --splashBackgroundColor '#09090b'
        continue-on-error: true

      - name: Re-sync after assets
        run: |
          npx cap sync android
          node scripts/cap-after-sync.cjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roleplay-playground-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
